name: Deploy Admin Panel to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'app/admin-panel/**'
      - '.github/workflows/deploy-admin-panel.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Next.js Standalone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: app/admin-panel/package-lock.json

      - name: Install dependencies and build
        working-directory: app/admin-panel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://safelabel-api-g6cnaah8ardsfpfs.uaenorth-01.azurewebsites.net' }}
        run: |
          npm ci || npm install
          npm run build
          # Copy static and public assets required by standalone server
          cp -r .next/static .next/standalone/app/admin-panel/.next/
          if [ -d "public" ]; then cp -r public .next/standalone/app/admin-panel/; fi

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-standalone
          path: app/admin-panel/.next/standalone
          include-hidden-files: true

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-standalone
          path: ./dist

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'safelabel-admin-ai' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./dist
