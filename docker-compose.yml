services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safelabel}
      POSTGRES_USER: ${POSTGRES_USER:-safelabel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safelabel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safelabel} -d ${POSTGRES_DB:-safelabel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  api:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./app/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-safelabel}:${POSTGRES_PASSWORD:-safelabel}@postgres:5432/${POSTGRES_DB:-safelabel}
      JWT_SECRET: ${JWT_SECRET:-safelabel-azure-jwt-secret-key-32chars}
      SERVER_IP: ${AZURE_SERVER_IP:-0.0.0.0}
    depends_on:
      postgres:
        condition: service_healthy

  admin-panel:
    build:
      context: ./app/admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${AZURE_SERVER_IP:-localhost}:${API_PORT:-8000}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://${AZURE_SERVER_IP:-localhost}:${API_PORT:-8000}
      PORT: 3000
    depends_on:
      - api

  mobile:
    build:
      context: ./app/mobile
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://${AZURE_SERVER_IP:-localhost}:${API_PORT:-8000}
    restart: unless-stopped
    ports:
      - "${MOBILE_PORT:-8081}:8081"
    environment:
      EXPO_PUBLIC_API_URL: http://${AZURE_SERVER_IP:-localhost}:${API_PORT:-8000}
      EXPO_PUBLIC_SERVER_IP: ${AZURE_SERVER_IP:-localhost}
      EXPO_PUBLIC_SERVER_PORT: ${API_PORT:-8000}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${AZURE_SERVER_IP:-localhost}
      CI: "1"
    depends_on:
      - api

volumes:
  postgres_data:
