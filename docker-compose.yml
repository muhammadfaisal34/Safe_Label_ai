services:
  api:
    build: ./app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ./app/backend/.env
    environment:
      DATABASE_URL: postgresql://safelabel:safelabel@postgres:5432/safelabel
      JWT_SECRET: change-this-secret
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safelabel
      POSTGRES_USER: safelabel
      POSTGRES_PASSWORD: safelabel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safelabel -d safelabel"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
